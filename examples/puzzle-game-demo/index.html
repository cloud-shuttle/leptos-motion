<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Game Demo - Leptos Motion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        /* Ensure text is selectable and right-click works */
        * {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
            pointer-events: auto !important;
        }
        /* Allow right-click context menu */
        * {
            -webkit-touch-callout: default !important;
            -webkit-user-select: text !important;
            -khtml-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }
        /* Specifically target text elements */
        p, h1, h2, h3, h4, h5, h6, span, div {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        // Ensure right-click and text selection work
        document.addEventListener('contextmenu', function(e) {
            // Allow right-click context menu
            e.stopPropagation();
        }, true);
        
        // Prevent any scripts from disabling text selection
        document.addEventListener('selectstart', function(e) {
            e.stopPropagation();
        }, true);
    </script>
    <script type="module">
        import init, { PuzzleGameDemo } from './puzzle_game_demo.js';
        
        async function run() {
            // Initialize the WASM module
            await init();
            
            // Mount the Leptos app
            PuzzleGameDemo();
            
            // Fix interactions after WASM loads
            setTimeout(() => {
                // Force enable text selection and right-click
                const app = document.getElementById('app');
                if (app) {
                    // Remove all event listeners that might be blocking interactions
                    const clone = app.cloneNode(true);
                    app.parentNode.replaceChild(clone, app);
                    
                    // Force enable text selection on the new element
                    clone.style.userSelect = 'text';
                    clone.style.webkitUserSelect = 'text';
                    clone.style.mozUserSelect = 'text';
                    clone.style.msUserSelect = 'text';
                    
                    // Add event listeners to ensure right-click works
                    clone.addEventListener('contextmenu', (e) => {
                        e.stopPropagation();
                        console.log('Right-click detected!');
                    }, true);
                    
                    clone.addEventListener('selectstart', (e) => {
                        e.stopPropagation();
                        console.log('Text selection started!');
                    }, true);
                    
                    // Force all child elements to allow text selection
                    const allElements = clone.querySelectorAll('*');
                    allElements.forEach(el => {
                        el.style.userSelect = 'text';
                        el.style.webkitUserSelect = 'text';
                        el.style.mozUserSelect = 'text';
                        el.style.msUserSelect = 'text';
                        el.style.pointerEvents = 'auto';
                    });
                    
                    // Add a global event listener to catch any blocked events
                    document.addEventListener('contextmenu', (e) => {
                        console.log('Global right-click detected!');
                    }, true);
                }
            }, 2000);
        }
        
        run().catch(console.error);
    </script>
</body>
</html>
