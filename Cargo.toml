[workspace]
members = [
    "crates/leptos-motion-core",
    "crates/leptos-motion-dom",
    "crates/leptos-motion-gestures",
    "crates/leptos-motion-layout",
    "crates/leptos-motion-scroll",
    "crates/leptos-motion",
    "crates/leptos-motion-macros",
    "crates/leptos-motion-studio",
    "crates/leptos-motion-webgl",
    "demos/basic/reactive-demo",
    "demos/showcase/comprehensive-demo",
    "demos/csr-demo",
    "demos/ssr-demo",
    "demos/native-test",
    "demos/reactive-animation-demo",
    "demos/awesome-demo",
    "demos/spectacular-demo",
    "demos/impressive-demo",
    "demos/path-drawing-demo",
    "examples/e-commerce-gallery",
    "examples/wasm-performance-demo",
    "examples/advanced-gestures",
    "examples/layout-animations",
    "examples/comprehensive-showcase",
    "examples/puzzle-game-demo",
    "examples/sidebar-menu-demo",
    "examples/scroll-progress-demo",
    "examples/path-morphing-demo",
    "examples/phase2-minimal-demo",
    "examples/simple-animation-demo",
    "tests/contracts",
    "tests/accessibility",
    "tests/wasm_specific",
    "tests/timing",
    "tests",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
authors = ["CloudShuttle Team <team@cloud-shuttle.io>"]
license = "MIT OR Apache-2.0"
edition = "2024"  # Latest edition as of September 2025
rust-version = "1.89"  # Latest stable as of September 2025
repository = "https://github.com/cloud-shuttle/leptos-motion"
homepage = "https://leptos-motion.dev"
documentation = "https://docs.rs/leptos-motion"
keywords = ["animation", "leptos", "wasm", "web", "ui"]
categories = ["gui", "wasm", "web-programming"]
description = "A comprehensive animation library for Leptos with Motion-inspired API"

[workspace.dependencies]
# Core Leptos dependencies (Testing with published leptos to verify fixes)
leptos = { version = "0.8.6", features = ["csr", "hydrate", "ssr"] }

# Test dependencies
reqwest = { version = "0.12", features = ["json"] }
leptos_macro = "0.8.6"  # Published version
reactive_graph = "0.2.6"  # Published version
leptos_meta = "0.8.5"
leptos_router = "0.8.6"

# Leptos Motion dependencies
leptos-motion-core = { path = "crates/leptos-motion-core" }
leptos-motion-dom = { path = "crates/leptos-motion-dom" }
leptos-motion-gestures = { path = "crates/leptos-motion-gestures" }
leptos-motion-layout = { path = "crates/leptos-motion-layout" }
leptos-motion-scroll = { path = "crates/leptos-motion-scroll" }
leptos-motion-macros = { path = "crates/leptos-motion-macros" }
leptos-motion-studio = { path = "crates/leptos-motion-studio" }
leptos-motion-webgl = { path = "crates/leptos-motion-webgl" }

# WASM-specific dependencies
getrandom = { version = "0.3", features = ["wasm_js"] }

# Web APIs (Latest stable versions)
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "DomRect",
    "Performance",
    "AnimationEvent",
    "TransitionEvent",
    "Animation",
    "KeyframeEffect",
    "EventTarget",
    "Event",
    "MouseEvent",
    "TouchEvent",
    "PointerEvent",
    "Touch",
    "TouchList",
    "AddEventListenerOptions",
    "Node",
    "WheelEvent",
    "KeyboardEvent",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Utility crates (Latest stable versions)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
paste = "1.0"

# CSS and styling
tailwind-rs-core = "0.6.0"


# Math and interpolation
num-traits = "0.2"
approx = "0.5"

# Async and futures (Latest stable versions)
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }

# Logging and debugging
log = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"

# Development and testing dependencies (Latest stable versions)
wasm-bindgen-test = "0.3"
pretty_assertions = "1.4"
test-case = "3.1"

# Modern TDD crates (Latest stable versions)
rstest = "0.19"
proptest = "1.4"
quickcheck = "1.0"
arbitrary = "1.4"
trybuild = "1.0"
macrotest = "1.0"
clitest = "0.1"

# Performance testing
criterion = { version = "0.5", features = ["html_reports"] }
divan = "0.1"
iai = "0.1"

# Coverage and testing tools
cargo-tarpaulin = "0.25"
cargo-llvm-cov = "0.6"
cargo-nextest = "0.14"

# Concurrency
rayon = "1.8"
async-std = "1.12"

# Development tools
cargo-watch = "8.4"
cargo-expand = "1.0"
cargo-udeps = "0.1"
cargo-audit = "0.18"
cargo-deny = "0.14"

[[workspace.metadata.leptos]]
name = "showcase"
path = "examples/showcase"
target = "examples/showcase/index.html"
dist = "examples/showcase/dist"
bin-package = "showcase"
lib-package = "showcase"
# Additional required fields for Leptos apps
client-package = "showcase"
client-features = ["csr"]
client-target = "wasm32-unknown-unknown"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
