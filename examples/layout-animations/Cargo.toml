[package]
name = "layout-animations"
version = "1.0.0"
edition = "2021"
description = "Layout animation examples for leptos-motion"
license = "MIT"

[dependencies]
leptos = { workspace = true, features = ["csr"] }
leptos_meta = { workspace = true }
leptos-motion = { path = "../../crates/leptos-motion", features = ["csr"] }
log = { workspace = true }
rand = "0.8"

# CSS and styling
tailwind-rs-core.workspace = true
tailwind-rs-wasm = "0.5.0"

web-sys.workspace = true
wasm-bindgen.workspace = true
console_log.workspace = true
console_error_panic_hook.workspace = true

[lib]
crate-type = ["cdylib"]