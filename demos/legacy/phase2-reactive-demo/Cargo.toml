[package]
name = "phase2-reactive-demo"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.8", features = ["csr"] }
leptos-motion-core = { path = "../crates/leptos-motion-core" }
leptos-motion-dom = { path = "../crates/leptos-motion-dom" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
