[package]
name = "leptos-motion-wasm-tests"
version = "0.1.0"
edition = "2021"
authors = ["Leptos Motion Team"]
license = "MIT"
description = "WASM-specific tests for leptos-motion library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.8", features = ["csr"] }
leptos-motion-core = { path = "../../crates/leptos-motion-core" }
leptos-motion-dom = { path = "../../crates/leptos-motion-dom" }

# Web dependencies
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
