<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Leptos Motion - Animation Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .animated-box-1 {
            width: 100px;
            height: 100px;
            background-color: #ff6347; /* Tomato */
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .animated-box-2 {
            width: 100px;
            height: 100px;
            background-color: #4682b4; /* SteelBlue */
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .animated-box-3 {
            width: 100px;
            height: 100px;
            background-color: #3cb371; /* MediumSeaGreen */
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="app">
        <p>Loading WASM module...</p>
    </div>
    
    <script type="module">
        import init, { init_leptos_app, test_rust, hello_world } from './pkg/simple_animation_demo.js';
        
        async function run() {
            try {
                console.log('Starting WASM initialization...');
                
                // Initialize the wasm module
                await init();
                console.log('WASM module initialized successfully!');
                
                // Test simple Rust function first
                console.log('Calling hello_world function...');
                hello_world();
                console.log('hello_world function called!');
                
                // Test the main function
                console.log('Calling test_rust function...');
                test_rust();
                console.log('test_rust function called!');
                
                // Initialize the Leptos animation demo
                console.log('Initializing Leptos animation demo...');
                init_leptos_app();
                console.log('Leptos demo initialization called!');
                
                console.log('WASM module loaded successfully!');
            } catch (error) {
                console.error('Error loading WASM module:', error);
                document.getElementById('app').innerHTML = `
                    <h1>❌ Error Loading Demo</h1>
                    <p>Failed to load the WASM module: ${error.message}</p>
                    <p>Make sure you're serving this from a web server (not file://)</p>
                `;
            }
        }
        
        run();
    </script>
</body>
</html>
