[package]
name = "advanced-features-showcase"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.8.10", features = ["csr", "hydrate"] }
leptos-motion = { path = "../../crates/leptos-motion" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "CssStyleDeclaration",
  "DomRect",
  "ResizeObserver",
  "ResizeObserverEntry",
] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
